[project]
name = "sharosoo-cdn"
version = "0.1.0"
description = "Upload files to cdn.sharosoo.com (Cloudflare R2) and print their public URLs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cdn = "sharosoo_cdn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharosoo_cdn"]
